<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>意見回饋 | Easy2Delivery</title>
<link href="/_ext/cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/_ext/fonts.googleapis.com/css2-1c68bdd9.css" rel="stylesheet"/>
<link href="/easy2delivery/style.css" rel="stylesheet"/>
<style>
        .page-header {
            padding: 180px 0 80px;
            text-align: center;
            background: linear-gradient(135deg, rgba(248, 250, 252, 1) 0%, rgba(240, 244, 248, 1) 100%);
        }

        .page-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px 120px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="navbar glass-effect" id="navbar" style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);">
<div class="container nav-container">
<a class="logo" href="/easy2delivery/index.html">
<img alt="Easy2Delivery Logo" class="brand-logo" src="/easy2delivery/logo.png"/>
<span class="logo-text"></span>
</a>
<ul class="nav-links">
<li><a href="/easy2delivery/index.html">回首頁</a></li>
</ul>
</div>
</nav>
<header class="page-header">
<div class="container">
<h1 class="hero-title" style="margin-bottom: 20px;">意見回饋</h1>
<p class="hero-subtitle" style="margin: 0 auto;">我們非常重視您的每一個建議。</p>
</div>
</header>
<main class="page-content">
<div class="bento-card border-light" style="padding: 40px; margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto;">
<h3 style="color: var(--text-main); margin-bottom: 16px; font-size: 1.5rem;">有任何 APP 使用上的建議或遇到 Bug？</h3>
<p style="margin-bottom: 32px;">請填寫下方表單與我們分享您的寶貴意見！</p>
<!-- TODO: create a Formspree form and replace REPLACE_ME with its form ID --><form action="https://formspree.io/f/REPLACE_ME" id="feedbackForm" method="POST">
<div class="form-group">
<label class="form-label" for="name">您的稱呼</label>
<input class="form-control" id="name" name="name" placeholder="請輸入姓名或暱稱" required="" type="text"/>
</div>
<div class="form-group">
<label class="form-label" for="email">電子郵件 / Email</label>
<input class="form-control" id="email" name="email" placeholder="以便我們回覆您" required="" type="email"/>
</div>
<div class="form-group">
<label class="form-label" for="category">回饋類型</label>
<select class="form-control" id="category" name="category" required="">
<option disabled="" selected="" value="">請選擇類型</option>
<option value="bug">問題或 Bug 回報</option>
<option value="feature">功能許願 / 建議</option>
<option value="other">其他</option>
</select>
</div>
<div class="form-group">
<label class="form-label" for="message">意見內容</label>
<textarea class="form-control" id="message" name="message" placeholder="請詳細描述您的問題或建議..." required=""></textarea>
</div>
<button class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 10px;" type="submit">
<i class="fas fa-paper-plane"></i> 送出意見
                </button>
</form>
<p style="margin-top: 32px; font-size: 0.95rem; opacity: 0.8;">或直接來信：support@easy2live.net</p>
</div>
</main>
<footer class="footer">
<div class="container footer-container">
<div class="footer-brand">
<div class="logo">
<img alt="Easy2Delivery Logo" class="brand-logo" src="/easy2delivery/logo.png"/>
<span class="logo-text"></span>
</div>
<div class="slogan-row">
<p class="footer-slogan"></p>
<div class="legal-links">
<a href="/easy2delivery/privacy.html">隱私權政策 (Privacy Policy)</a>
<a href="/easy2delivery/feedback.html">意見回饋 (Feedback)</a>
</div>
</div>
</div>
<div class="footer-bottom">
<div class="footer-text">
<p class="footer-copyright"></p>
</div>
</div>
</div>
</footer>
<script src="/easy2delivery/content.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof SITE_CONTENT !== 'undefined') {
                const c = SITE_CONTENT;
                document.querySelectorAll('.logo-text').forEach(el => el.innerHTML = `${c.brandNameBase}<span class="highlight">${c.brandNameHighlight}</span>`);
                const slogan = document.querySelector('.footer-slogan'); if (slogan) slogan.textContent = c.footerSlogan;
                const copyright = document.querySelector('.footer-copyright'); if (copyright) copyright.textContent = c.footerCopyright;
            }
        });
    </script>
</body>
</html>
